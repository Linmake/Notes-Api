[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  GIT_SUBMODULE_STRATEGY = "none"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Opcional: Para mejor performance
[[headers]]
  for = "/*"
  [headers.values]
    "Cache-Control" = "public, max-age=0, must-revalidate"